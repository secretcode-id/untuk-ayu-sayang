<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Untuk Kamu ❤️</title>
    <style>
        * { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' style='font-size:24px'><text y='24'>🐱</text></svg>"), auto; }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #ffc5d3;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* CONTAINER UTAMA */
        .main-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
        }

        /* LAPISAN 1: Background Blur (Paling Belakang) */
        .glass-bg {
            position: absolute;
            background: rgba(255, 255, 255, 0.3); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 4px solid #fff;
            width: 85%;
            max-width: 350px;
            height: auto;
            min-height: 200px;
            border-radius: 20px;
            z-index: 5; /* Di bawah bunga */
            box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.05);
        }

        /* LAPISAN 2: Hujan Bunga (Z-Index: 10) */
        .sunflower {
            position: fixed;
            top: -100px;
            z-index: 10; /* Di atas background, tapi di bawah tulisan */
            user-select: none;
            pointer-events: none;
            animation: fall linear forwards;
        }

        /* LAPISAN 3: Konten Tulisan (Paling Depan) */
        .content-overlay {
            position: relative;
            z-index: 20; /* Paling atas agar tulisan tetap jelas */
            text-align: center;
            padding: 40px 20px;
            max-width: 320px;
            pointer-events: none; /* Biar klik "tembus" ke tombol */
        }

        /* Tombol harus bisa diklik */
        .btn-pixel {
            background-color: #ffffff;
            color: #000;
            border: 4px solid #000;
            padding: 15px 20px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 4px 4px 0 #000;
            cursor: pointer;
            margin-top: 20px;
            pointer-events: auto; /* Aktifkan klik kembali */
            touch-action: manipulation;
        }

        @keyframes fall {
            to { transform: translateY(120vh) rotate(360deg); }
        }

        /* POP UP (Z-Index Paling Tinggi) */
        #popup {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 500;
            justify-content: center;
            align-items: center;
        }

        .popup-pixel-content {
            background: #fff;
            border: 5px solid #000;
            padding: 30px;
            text-align: center;
            width: 80%;
            max-width: 300px;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- Background Kotak -->
        <div class="glass-bg"></div>

        <!-- Tulisan & Tombol -->
        <div class="content-overlay">
            <h1 style="color: #fff; text-shadow: 2px 2px #ff8fa3; font-size: 22px;">I'M SO SORRY...</h1>
            <p style="color: #444; font-size: 14px; font-weight: bold;">
                Aku beneran minta maaf ya sayang. Belajar ngoding ini demi kamu biar dimaafin ehehe.. 🌻
            </p>
            <button class="btn-pixel" onclick="showPopup()">KLIK DISINI</button>
        </div>
    </div>

    <div id="popup">
        <div class="popup-pixel-content">
            <div style="font-size: 40px;">❤️</div>
            <h2 style="font-size: 18px;">MAKASIH SAYANG!</h2>
            <p style="font-size: 13px;">I promise to be better. Love you!</p>
            <button class="btn-pixel" style="font-size: 12px; background: #ffc5d3;" onclick="closePopup()">CLOSE</button>
        </div>
    </div>

    <script>
        function createSunflower() {
            const flower = document.createElement('div');
            flower.classList.add('sunflower');
            flower.innerText = '🌻';
            flower.style.left = Math.random() * 100 + "vw";
            
            // Ukuran gede
            const size = Math.random() * 25 + 35; 
            flower.style.fontSize = size + "px";
            
            // Variasi transparansi biar estetik
            flower.style.opacity = Math.random() * 0.5 + 0.5;

            const duration = Math.random() * 3 + 3;
            flower.style.animationDuration = duration + "s";
            
            document.body.appendChild(flower);
            setTimeout(() => { flower.remove(); }, duration * 1000);
        }

        setInterval(createSunflower, 180);

        function showPopup() { document.getElementById('popup').style.display = 'flex'; }
        function closePopup() { document.getElementById('popup').style.display = 'none'; }
    </script>
</body>
</html>
